<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>水族日历</title>
  <style>
    :root {
      --bg0: #c8d9f0;
      --bg1: #e8dff5;
      --bg2: #d4e8e0;
      --glass: rgba(255,255,255,.55);
      --glass-strong: rgba(255,255,255,.72);
      --glass-border: rgba(255,255,255,.45);
      --text: #1c1c1e;
      --muted: #6c6c70;
      --separator: rgba(60,60,67,.12);
      --blue: #007aff;
      --blue-fill: #007aff;
      --red: #ff3b30;
      --green: #34c759;
      --weekend: #007aff;
      --shadow: 0 8px 32px rgba(31,38,135,.12);
      --radius: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    [data-theme="dark"] {
      --bg0: #0b1220;
      --bg1: #1a1030;
      --bg2: #0f1f1a;
      --glass: rgba(28,28,30,.62);
      --glass-strong: rgba(44,44,46,.75);
      --glass-border: rgba(255,255,255,.08);
      --text: #f5f5f7;
      --muted: #98989f;
      --separator: rgba(84,84,88,.45);
      --blue: #0a84ff;
      --blue-fill: #0a84ff;
      --red: #ff3b30;
      --green: #30d158;
      --weekend: #0a84ff;
      --shadow: 0 8px 32px rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
        "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      color: var(--text);
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(1200px 800px at 10% -10%, var(--bg1), transparent 55%),
        radial-gradient(900px 700px at 100% 0%, var(--bg2), transparent 50%),
        radial-gradient(800px 600px at 50% 100%, var(--bg0), transparent 55%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 45%, var(--bg2));
      background-attachment: fixed;
    }
    /* 毛玻璃卡片 */
    .glass {
      background: #ffffff;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      border-radius: var(--radius);
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .glass-strong {
      background: #ffffff;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      border-radius: var(--radius);
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    [data-theme="dark"] .glass,
    [data-theme="dark"] .glass-strong {
      background: #1c1c1e;
      box-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    .sand-screen.glass-strong, .calendar-card.glass {
      /* 继承 .glass / .glass-strong */
    }

    .page {
      max-width: 430px;
      margin: 0 auto;
      padding: 12px 14px calc(24px + var(--safe-bottom));
      min-height: 100vh;
      background: transparent;
    }
    @media (min-width: 760px) {
      .page { max-width: 780px; padding-top: 24px; }
      .layout-wide {
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 14px;
        align-items: start;
      }
    }

    /* 顶栏 */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 2px 14px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .topbar .hint { display: none; }
    .pill-btn {
      border: none;
      background: var(--glass-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--blue);
      font-size: .9rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 980px;
      cursor: pointer;
      border: 1px solid var(--glass-border);
    }
    .pill-btn:active { opacity: .7; }

    /* 详情 */
    .sand-screen {
      padding: 18px 16px 16px;
      margin-bottom: 12px;
    }
    .sand-head-date {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .sand-head-date h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--blue);
    }
    .sand-head-date span, .sand-head-date em {
      font-style: normal;
      color: var(--muted);
      font-size: .9rem;
    }
    .sand-number-wrap { margin: 8px 0 12px; }
    .sand-number-wrap strong {
      font-size: 3.6rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .sand-number-wrap p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .95rem;
    }
    .sand-lunar {
      background: #f2f2f7;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-radius: 14px;
      padding: 12px 14px;
      border: none;
    }
    [data-theme="dark"] .sand-lunar {
      background: rgba(120,120,128,.22);
    }
    [data-theme="dark"] .sand-lunar {
      background: rgba(120,120,128,.18);
    }
    .sand-lunar small {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 500;
    }
    .sand-lunar strong {
      display: block;
      font-size: 1.2rem;
      margin: 4px 0 10px;
      font-weight: 600;
    }
    .sand-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .sand-pill-row span {
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 980px;
      padding: 4px 11px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .block-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 14px 0 8px;
    }
    .block-title h3 { margin: 0; font-size: .95rem; font-weight: 600; }
    .block-title p { margin: 0; color: var(--muted); font-size: .72rem; }
    .market-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .market-tags span {
      background: rgba(0,122,255,.12);
      color: var(--blue);
      border-radius: 980px;
      padding: 5px 12px;
      font-size: .8rem;
      font-weight: 600;
    }
    [data-theme="dark"] .market-tags span {
      background: rgba(10,132,255,.2);
    }
    .almanac-card {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--separator);
    }
    .almanac-head {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .almanac-head strong { font-size: .95rem; }
    .almanac-head span { color: var(--muted); font-size: .78rem; }
    .almanac-rows {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .almanac-panel em {
      font-style: normal;
      font-weight: 700;
      font-size: .85rem;
    }
    .almanac-panel--yes em { color: var(--green); }
    .almanac-panel--no em { color: var(--red); }
    .almanac-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }
    .almanac-yes, .almanac-no {
      font-size: .7rem;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 500;
    }
    .almanac-yes {
      background: rgba(52,199,89,.15);
      color: #1b7f3a;
    }
    .almanac-no {
      background: rgba(255,59,48,.12);
      color: #007aff;
    }
    [data-theme="dark"] .almanac-yes { color: #30d158; background: rgba(48,209,88,.15); }
    [data-theme="dark"] .almanac-no { color: #ff6961; background: rgba(255,69,58,.15); }
    .festival-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    /* 月历 — 苹果风格 */
    .calendar-card {
      padding: 10px 8px 14px;
      margin-bottom: 8px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 4px 2px 10px;
    }
    .toolbar-mid {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: var(--blue);
      font-size: 1.55rem;
      font-weight: 300;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      line-height: 1;
    }
    .nav-btn:active { background: rgba(0,122,255,.12); }
    select.neu-select, .neu-select {
      border: none;
      background: rgba(120,120,128,.12);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: .95rem;
      font-weight: 600;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }
    .icon-btn, #todayBtn {
      border: none;
      background: transparent;
      color: var(--blue);
      font-size: .9rem;
      font-weight: 600;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 8px;
    }

    .week-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: var(--muted);
      padding: 4px 0 6px;
      font-size: .78rem;
    }
    .week-row .weekend { color: var(--weekend); }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px 0;
    }
    .day-cell {
      border: none;
      background: transparent;
      border-radius: 14px;
      padding: 4px 1px 6px;
      min-height: 54px;
      cursor: pointer;
      text-align: center;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .day-cell strong {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      margin: 0 auto;
      font-size: 1.2rem;
      font-weight: 500;
      border-radius: 11px;
      letter-spacing: -0.02em;
    }
    .day-cell small {
      display: block;
      font-size: .6rem;
      color: var(--muted);
      margin-top: 1px;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 1px;
    }
    .day-cell .festival-line {
      color: var(--red);
      font-weight: 600;
    }
    .day-cell.weekend strong { color: var(--weekend); }
    .day-cell.weekend small:not(.festival-line) { color: var(--weekend); opacity: .9; }

    /* 今日：蓝底白字 */
    .day-cell.today strong {
      background: var(--blue-fill);
      color: #fff !important;
      box-shadow: none;
      font-weight: 600;
    }
    .day-cell.today small {
      color: var(--blue);
      font-weight: 600;
    }
    /* 选中：描边（若同时是今日，保持蓝底） */
    .day-cell.active:not(.today) strong {
      background: transparent;
      box-shadow: inset 0 0 0 1.5px var(--blue);
      color: var(--blue) !important;
      font-weight: 600;
    }
    .day-cell.active:not(.today) small {
      color: var(--blue);
      font-weight: 600;
    }
    .day-cell.active.today strong {
      background: var(--blue-fill);
      color: #fff !important;
      box-shadow: none;
    }

    .holiday-badge { display: none; }

    .ghost-day {
      min-height: 54px;
      opacity: .28;
      pointer-events: none;
      text-align: center;
      padding: 4px 1px 6px;
      color: var(--muted);
    }
    .ghost-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .55rem;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: .7rem;
      margin-top: 12px;
      opacity: .75;
    }
    .footer-note code {
      font-size: .65rem;
      background: var(--glass);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .lunar-line { color: var(--muted); }

    /* 兼容旧 class 名 */
    .neu, .neu-soft, .neu-inset { }
    .neu-btn {
      border: none;
      background: var(--glass-strong);
      color: var(--blue);
      border-radius: 980px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      border: 1px solid var(--glass-border);
    }
  
    .theme-icon-btn {
      border: none;
      background: transparent;
      color: var(--blue);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .theme-icon-btn:active { background: rgba(0,122,255,.1); }
    .pill-btn { display: none; }
    
    .sand-lunar small { display: none; }
    .sand-lunar strong,
    .sand-lunar strong.water-pill,
    #detailWaterText.water-pill {
      display: inline-block;
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 10px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--glass-strong, #ffffff);
      border: 1px solid var(--glass-border, rgba(0,0,0,.06));
      box-shadow: 2px 2px 5px var(--shadow-dark, transparent), -2px -2px 5px var(--shadow-light, transparent);
      line-height: 1.3;
      letter-spacing: 0.02em;
    }
    [data-theme="dark"] .sand-lunar strong,
    [data-theme="dark"] #detailWaterText.water-pill {
      background: rgba(44,44,46,.9);
      border-color: rgba(255,255,255,.08);
    }

  
    .week-fest-line {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 400;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .week-fest-line #dashWeek,
    .week-fest-line .festival-note,
    #detailFestival.festival-note {
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 400;
    }
    .week-fest-sep { color: var(--muted); opacity: .5; }
    /* 有节日/节气时红色 */
    #detailFestival.is-festival {
      color: var(--red, #007aff) !important;
      font-weight: 500;
    }

  
    /* 年月触发条（图1风格） */
    .cal-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 12px;
      gap: 8px;
    }
    /* old red ym-trigger removed */
    .ym-trigger:active { opacity: .88; }
    .ym-chevron {
      font-size: 0.85em;
      opacity: .95;
      margin-left: 2px;
      line-height: 1;
    }
    

    /* 选择器弹层（图2风格） */
    .picker-mask {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.4);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .picker-mask[hidden] { display: none !important; }
    .picker-sheet {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 12px);
      box-shadow: 0 -8px 32px rgba(0,0,0,.12);
      animation: sheetUp .28s ease;
    }
    @keyframes sheetUp {
      from { transform: translateY(40%); opacity: .5; }
      to { transform: translateY(0); opacity: 1; }
    }
    [data-theme="dark"] .picker-sheet { background: #1c1c1e; }
    .picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(60,60,67,.12);
      gap: 10px;
    }
    .picker-cancel, .picker-confirm {
      border: none;
      background: transparent;
      font-size: .95rem;
      padding: 8px 12px;
      cursor: pointer;
      color: #8e8e93;
      font-weight: 500;
    }
    .picker-confirm {
      background: #007aff;
      color: #fff;
      border-radius: 980px;
      padding: 8px 18px;
      font-weight: 600;
    }
    .picker-segment {
      display: flex;
      background: #fff;
      border: 1.5px solid #007aff;
      border-radius: 980px;
      padding: 0;
      overflow: hidden;
    }
    .seg-btn {
      flex: 1;
      border: none;
      background: #fff;
      color: #007aff;
      font-size: .9rem;
      font-weight: 600;
      padding: 7px 0;
      border-radius: 0;
      cursor: pointer;
    }
    .seg-btn.active {
      background: #007aff;
      color: #fff;
    }
    .seg-btn + .seg-btn { border-left: 1.5px solid #007aff; }
    .picker-wheels {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      height: 220px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
      mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
    }
    .picker-col {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      text-align: center;
      padding: 88px 0;
      scrollbar-width: none;
    }
    .picker-col::-webkit-scrollbar { display: none; }
    .picker-item {
      height: 44px;
      line-height: 44px;
      scroll-snap-align: center;
      font-size: 1.05rem;
      color: #c7c7cc;
      font-weight: 400;
      transition: color .15s, font-size .15s;
    }
    .picker-item.active {
      color: #1c1c1e;
      font-size: 1.2rem;
      font-weight: 600;
    }
    [data-theme="dark"] .picker-item { color: #636366; }
    [data-theme="dark"] .picker-item.active { color: #f5f5f7; }
    .picker-highlight {
      pointer-events: none;
      position: absolute;
      left: 12px; right: 12px;
      top: 50%;
      height: 44px;
      margin-top: -22px;
      border-top: 1px solid rgba(60,60,67,.12);
      border-bottom: 1px solid rgba(60,60,67,.12);
      border-radius: 8px;
    }

  
    .cal-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 4px 4px 10px;
    }
    .ym-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ym-trigger {
      flex: 0 1 auto;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--blue, #007aff);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      padding: 6px 4px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .ym-trigger:active { opacity: .65; }
    .ym-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 300;
      line-height: 1;
      color: var(--blue, #007aff);
      transform: rotate(90deg);
      margin-left: 2px;
      width: 1.1em;
    }
    .today-chip {
      border: none;
      background: rgba(0,122,255,.12);
      color: var(--blue, #007aff);
      font-size: .88rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 980px;
      cursor: pointer;
    }
    .today-chip:active { opacity: .7; }
    .today-chip[hidden] { display: none !important; }
    [data-theme="dark"] .today-chip {
      background: rgba(10,132,255,.2);
    }

  
    /* final toolbar overrides */
    .cal-toolbar { justify-content: flex-start !important; gap: 0 !important; }
    .ym-trigger {
      background: transparent !important;
      color: var(--blue, #007aff) !important;
      font-size: 1.2rem !important;
      font-weight: 600 !important;
      padding: 6px 4px !important;
      border-radius: 8px !important;
      box-shadow: none !important;
    }
    .ym-chevron {
      display: inline-flex !important;
      transform: rotate(90deg) !important;
      font-size: 1.35rem !important;
      font-weight: 300 !important;
      color: var(--blue, #007aff) !important;
      opacity: 1 !important;
    }

  
    /* toolbar center */
    .cal-toolbar {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 4px 4px 10px !important;
    }
    .ym-row {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 10px !important;
    }

    /* 居中卡片选择器 */
    .picker-mask {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1000 !important;
      background: rgba(0,0,0,.45) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 20px !important;
    }
    .picker-mask[hidden] { display: none !important; }
    .picker-sheet {
      width: min(100%, 340px) !important;
      max-width: 340px !important;
      background: #fff !important;
      border-radius: 16px !important;
      padding-bottom: 12px !important;
      box-shadow: 0 12px 40px rgba(0,0,0,.2) !important;
      animation: sheetPop .22s ease !important;
      margin: 0 !important;
    }
    @keyframes sheetPop {
      from { transform: scale(.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]

  }
  function formatWeek(day) {
    return "星期" + (weekNames[Number(day.weekIndex || 0)] || day.week || "");

  function formatLunar(day) {
    return `农历 ${day.lunarMonthText || ((day.isLeap ? "闰" : "") + day.lunarMonth + "月")}${day.lunarDayText || day.lunarDay + "日"}`;

  function formatWater(day) {
    const CN_DAY = {1:"初一",2:"初二",3:"初三",4:"初四",5:"初五",6:"初六",7:"初七",8:"初八",9:"初九",10:"初十",11:"十一",12:"十二",13:"十三",14:"十四",15:"十五",16:"十六",17:"十七",18:"十八",19:"十九",20:"二十",21:"廿一",22:"廿二",23:"廿三",24:"廿四",25:"廿五",26:"廿六",27:"廿七",28:"廿八",29:"廿九",30:"三十",31:"卅一"};
    const m = waterMonths[Number(day.waterMonthIndex || 0)] || day.waterMonth || "";
    const d = Number(day.waterDay || 0);
    const dayText = CN_DAY[d] || (String(day.waterDay || "") + "日");

  function dayLabel(day) {
    const DUAN = ["套头端","水东端","端十六","塘州端","三洞端","牛场端","扬拱端"];
    const duan = (day.duanFestival || "").trim()
      || DUAN.find(n => (day.festival || "").includes(n))
      || "";
    if (duan) return { text: duan, className: "festival-line" };
    const fest = (day.festival || "").trim();
    const term = (day.solarTerm || "").trim();
    let festShow = fest;
    DUAN.forEach(n => { festShow = festShow.split(n).join(""); });
    festShow = festShow.replace(/\s+/g, " ").trim();
    if (festShow && term) return { text: festShow + " " + term, className: "festival-line" };
    if (festShow) return { text: festShow, className: "festival-line" };
    if (term) return { text: term, className: "festival-line" };
    const lunarMonth = day.lunarMonthText || ((day.isLeap ? "闰" : "") + (day.lunarMonth || "") + "月");
    const lunarDay = day.lunarDayText || ((day.lunarDay || "") + "日");
    return { text: lunarMonth + lunarDay, className: "lunar-line" };

  function applyStaticAlmanac(dayOrDate) {
    const clashEl = document.querySelector("#almanacClash");

    const jiEl = document.querySelector("#jiBadges");
    if (!clashEl || !yiEl || !jiEl) return;

    let yiList = null;
    let jiList = null;
    let clash = "";
    let jianchu = "";

    if (dayOrDate && typeof dayOrDate === "object") {
      if (Array.isArray(dayOrDate.yi)) yiList = dayOrDate.yi.slice();
      if (Array.isArray(dayOrDate.ji)) jiList = dayOrDate.ji.slice();
      clash = dayOrDate.clash || "";
      jianchu = dayOrDate.jianchu || "";
      // 若当前 day 无宜忌，尝试从 current.days 回填
      if ((!yiList || !jiList) && current && Array.isArray(current.days) && dayOrDate.date) {
        const found = current.days.find(d => d.date === dayOrDate.date);
        if (found) {
          if (!yiList && Array.isArray(found.yi)) yiList = found.yi.slice();
          if (!jiList && Array.isArray(found.ji)) jiList = found.ji.slice();
          if (!clash) clash = found.clash || "";
          if (!jianchu) jianchu = found.jianchu || "";
        }
      }
    } else if (typeof dayOrDate === "string" && typeof STATIC_ALMANAC !== "undefined" && STATIC_ALMANAC[dayOrDate]) {
      const info = STATIC_ALMANAC[dayOrDate];
      yiList = (info.yi || []).slice();
      jiList = (info.ji || []).slice();
      clash = info.clash || "";
    }

    if (!yiList || !jiList) {
      clashEl.textContent = clash || "宜忌加载中（请确保 calendar-data 可访问）";
      yiEl.innerHTML = '<span class="almanac-yes">诸事不宜</span>';
      jiEl.innerHTML = '<span class="almanac-no">诸事不宜</span>';

    if (!yiList.length || (yiList.length === 1 && yiList[0] === "诸事不宜")) {
      yiList = ["诸事不宜"];
      jiList = ["诸事不宜"];
    }

    if (jianchu && clash.indexOf(jianchu) < 0) {
      clash = (clash ? clash + " · " : "") + jianchu + "日";

    clashEl.textContent = clash || "";
    yiEl.innerHTML = yiList.map(x => `<span class="almanac-yes">${escapeHtml(x)}</span>`).join("");
    jiEl.innerHTML = jiList.map(x => `<span class="almanac-no">${escapeHtml(x)}</span>`).join("");

  // 数据加载优先级：
  // 1) 本地静态 JSON：calendar-data/YYYY-MM.json  （适合 CF Pages 纯静态）

  // 3) 都没有则提示
  const monthCache = new Map();

  async function fetchMonthData(year, month) {
    const y = Number(year), m = Number(month);
    const key = `${y}-${String(m).padStart(2, "0")}`;
    if (monthCache.has(key)) return monthCache.get(key);

    const candidates = [
      `calendar-data/${key}.json`,
      `./calendar-data/${key}.json`,
      `api.php?year=${y}&month=${m}&lang=zh-CN`
    ];

    let lastErr;
    for (const url of candidates) {
      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) throw new Error(`${url} ${res.status}`);
        const data = await res.json();
        if (!data || !Array.isArray(data.days)) throw new Error("bad shape");
        monthCache.set(key, data);
        return data;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error("no data");
  }

  function monthHasYi(data) {
    return !!(data && Array.isArray(data.days) && data.days.length
      && Array.isArray(data.days[0].yi) && Array.isArray(data.days[0].ji));
  }

  async function tryLoadMonth(year, month) {
    const y = Number(year), m = Number(month);
    // 同月且已有宜忌数据才直接用内存，否则强制拉取 JSON
    if (y === current.year && m === current.month && monthHasYi(current)) {
      renderMonth(current);
      return;
    }
    try {
      const data = await fetchMonthData(y, m);
      renderMonth(data);
    } catch (e) {
      console.warn(e);
      // 拉取失败时：若同月有内嵌数据仍可显示（可能无宜忌）
      if (y === current.year && m === current.month && current.days && current.days.length) {
        renderMonth(current);
        return;
      }
      alert(
        `没有找到 ${y}年${m}月 的数据。\n\n` +
        `请把 JSON 放到：calendar-data/${y}-${String(m).padStart(2,"0")}.json\n` +
        `或提供同源 api.php 接口。`
      );
      yearSelect.value = String(current.year);
      monthSelect.value = String(current.month);
    }
  }

    if (y > DATA_MAX_YEAR) { y = DATA_MAX_YEAR; m = 12; }
    tryLoadMonth(y, m);
  }

  function _leapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
  function _leapDays(y){ return _leapMonth(y) ? ((LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29) : 0; }
  function _monthDays(y,m){ return (LUNAR_INFO[y-1900] & (0x10000 >> m)) ? 30 : 29; }
  function _yearDays(y){
    let sum = 348;
    for (let i=0x8000; i>0x8; i>>=1) sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0;
    return sum + _leapDays(y);
  }
  // 公历转农历
  function solarToLunar(sy, sm, sd) {
    const baseUTC = Date.UTC(1900, 0, 31);
    const objUTC = Date.UTC(sy, sm - 1, sd);
    let offset = Math.round((objUTC - baseUTC) / 86400000);
    let y, m, leap = 0, isLeap = false, daysOfMonth = 0;
    for (y = 1900; y < 2101 && offset > 0; y++) {
      const yd = _yearDays(y);
      if (offset < yd) break;
      offset -= yd;
    }
    if (y > 2100) y = 2100;
    const leapM = _leapMonth(y);
    for (m = 1; m < 13 && offset > 0; m++) {
      if (leapM > 0 && m === (leapM + 1) && !isLeap) {
        --m;
        isLeap = true;
        daysOfMonth = _leapDays(y);
      } else {
        daysOfMonth = _monthDays(y, m);
      }
      if (offset < daysOfMonth) break;
      offset -= daysOfMonth;
      if (isLeap && m === (leapM + 1)) isLeap = false;
    }
    if (offset === 0 && leapM > 0 && m === leapM + 1) {
      if (isLeap) { isLeap = false; }
      else { isLeap = true; --m; }
    }
    const d = offset + 1;
    return { year: y, month: m, day: d, isLeap: isLeap };
  }
  // 农历转公历
  function lunarToSolar(ly, lm, ld, isLeap) {
    let offset = 0;
    for (let y = 1900; y < ly; y++) offset += _yearDays(y);
    const leapM = _leapMonth(ly);
    for (let m = 1; m < lm; m++) {
      offset += _monthDays(ly, m);
      if (leapM > 0 && m === leapM) offset += _leapDays(ly);
    }
    if (isLeap && leapM === lm) {
      offset += _monthDays(ly, lm); // 先加上正常月，再落到闰月日
    }
    offset += ld - 1;
    // 用 UTC 避免时区导致少一天
    const baseUTC = Date.UTC(1900, 0, 31);
    const dt = new Date(baseUTC + offset * 86400000);
    return {
      year: dt.getUTCFullYear(),
      month: dt.getUTCMonth() + 1,
      day: dt.getUTCDate()
    };
  }

  function buildCol(el, items, selectedIdx) {

  function refreshPickerCols() {
    const yEl = document.getElementById("pickerYear");
    const mEl = document.getElementById("pickerMonth");
    const dEl = document.getElementById("pickerDay");
    const minY = (typeof DATA_MIN_YEAR !== "undefined") ? DATA_MIN_YEAR : 2000;
    const maxY = (typeof DATA_MAX_YEAR !== "undefined") ? DATA_MAX_YEAR : 2100;

    if (pickerMode === "lunar") {
      // 农历：年 / 月(含闰月) / 日
      const years = [];
      for (let y = minY; y <= maxY; y++) years.push(y + "年");
      if (pickY < minY) pickY = minY;
      if (pickY > maxY) pickY = maxY;
      const leapM = _leapMonth(pickY);
      const months = [];
      const monthMeta = []; // {m, isLeap}
      for (let m = 1; m <= 12; m++) {
        months.push(LUNAR_MONTH_NAMES[m - 1]);
        monthMeta.push({ m: m, isLeap: false });
        if (leapM === m) {
          months.push("闰" + LUNAR_MONTH_NAMES[m - 1]);
          monthMeta.push({ m: m, isLeap: true });
        }
      }
      // pickM / pickLeap
      let mi = monthMeta.findIndex(x => x.m === pickM && x.isLeap === !!pickLeap);
      if (mi < 0) mi = monthMeta.findIndex(x => x.m === pickM && !x.isLeap);
      if (mi < 0) mi = 0;
      pickM = monthMeta[mi].m;
      pickLeap = monthMeta[mi].isLeap;
      const dim = pickLeap ? _leapDays(pickY) : _monthDays(pickY, pickM);
      if (pickD > dim) pickD = dim;
      if (pickD < 1) pickD = 1;
      const days = [];
      for (let d = 1; d <= dim; d++) {
        const so = (typeof lunarToSolar === "function")
          ? lunarToSolar(pickY, pickM, d, pickLeap)
          : null;
        let wtxt = "";
        if (so) {

        days.push((LUNAR_DAY_NAMES[d] || (d + "日")) + wtxt);
      }
      const yi = pickY - minY;
      buildCol(yEl, years, yi);
      buildCol(mEl, months, mi);
      buildCol(dEl, days, pickD - 1);

      for (let y = minY; y <= maxY; y++) years.push(y + "年");

      for (let m = 1; m <= 12; m++) months.push(m + "月");
      const dim = daysInMonth(pickY, pickM);
      if (pickD > dim) pickD = dim;
      const days = [];
      for (let d = 1; d <= dim; d++) days.push(weekLabel(pickY, pickM, d));
      const yi = Math.max(0, years.findIndex(t => t === pickY + "年"));
      buildCol(yEl, years, yi);
      buildCol(mEl, months, pickM - 1);
      buildCol(dEl, days, pickD - 1);
      mEl._monthMeta = null;
    }
  }

  function colSelectFromScroll(el) {
    const itemH = 44;
    const idx = Math.round(el.scrollTop / itemH);
    const max = (el._items || []).length - 1;
    const i = Math.max(0, Math.min(max, idx));
    el.querySelectorAll(".picker-item").forEach((n, j) => {
      n.classList.toggle("active", j === i);
    });
    el._selectedIdx = i;
    return i;
  }

  function bindCol(el, onChange) {
    let timer;
    el.addEventListener("scroll", () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const i = colSelectFromScroll(el);
        const itemH = 44;
        el.scrollTo({ top: i * itemH, behavior: "smooth" });
        onChange(i);
      }, 80);
    });
  }

  function openPicker() {
    // 详情区当前日期（不是系统今日）
    let base = window._detailDate || "";
    if (!base && current && current.days) {
      const cells = document.querySelectorAll(".day-cell");
      const ai = [...cells].findIndex(el => el.classList.contains("active"));
      if (ai >= 0 && current.days[ai]) base = current.days[ai].date;
    }
    if (!base && current && current.days && current.days[0]) base = current.days[0].date;
    const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(base));
    if (parts) {
      pickY = Number(parts[1]);
      pickM = Number(parts[2]);
      pickD = Number(parts[3]);
    } else {
      pickY = Number(current && current.year) || 2026;
      pickM = Number(current && current.month) || 8;
      pickD = 1;
    }
    pickLeap = false;
    if (pickerMode === "lunar" && typeof solarToLunar === "function") {
      const lu = solarToLunar(pickY, pickM, pickD);
      pickY = lu.year; pickM = lu.month; pickD = lu.day; pickLeap = !!lu.isLeap;
    }
    refreshPickerCols();
    const mask = document.getElementById("pickerMask");
    if (mask) mask.hidden = false;
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        ["pickerYear","pickerMonth","pickerDay"].forEach(id => {
          const el = document.getElementById(id);
          if (!el) return;
          el.scrollTop = (el._selectedIdx || 0) * 44;
        });
      });
    });
  }
  function closePicker() {
    pickerMask.hidden = true;
    document.body.style.overflow = "";
  }

  if (ymTrigger) ymTrigger.addEventListener("click", openPicker);
  document.getElementById("pickerCancel")?.addEventListener("click", closePicker);
  pickerMask?.addEventListener("click", (e) => { if (e.target === pickerMask) closePicker(); });

  document.getElementById("pickerSegment")?.addEventListener("click", (e) => {
    const btn = e.target.closest(".seg-btn");
    if (!btn) return;
    document.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const next = btn.dataset.mode || "solar";
    if (next !== pickerMode) {
      if (next === "lunar" && pickerMode === "solar") {
        const lu = solarToLunar(pickY, pickM, pickD);
        pickY = lu.year; pickM = lu.month; pickD = lu.day; pickLeap = !!lu.isLeap;
      } else if (next === "solar" && pickerMode === "lunar") {
        const so = lunarToSolar(pickY, pickM, pickD, pickLeap);
        pickY = so.year; pickM = so.month; pickD = so.day; pickLeap = false;
      }
      pickerMode = next;
      refreshPickerCols();
    }
  });

  const yEl = document.getElementById("pickerYear");
  const mEl = document.getElementById("pickerMonth");
  const dEl = document.getElementById("pickerDay");
  if (yEl) bindCol(yEl, (i) => {
    const minY = (typeof DATA_MIN_YEAR !== "undefined") ? DATA_MIN_YEAR : 2000;
    pickY = minY + i;
    refreshPickerCols();
  });
  if (mEl) bindCol(mEl, (i) => {
    if (pickerMode === "lunar" && mEl._monthMeta && mEl._monthMeta[i]) {
      pickM = mEl._monthMeta[i].m;
      pickLeap = !!mEl._monthMeta[i].isLeap;
    } else {
      pickM = i + 1;
      pickLeap = false;
    }
    refreshPickerCols();
  });
  if (dEl) bindCol(dEl, (i) => {
    pickD = i + 1;
  });

  document.getElementById("pickerConfirm")?.addEventListener("click", () => {
    const minY = (typeof DATA_MIN_YEAR !== "undefined") ? DATA_MIN_YEAR : 2000;
    const yEl = document.getElementById("pickerYear");
    const mEl = document.getElementById("pickerMonth");
    const dEl = document.getElementById("pickerDay");
    function snapCol(el) {
      if (!el) return 0;
      const itemH = 44;
      const n = (el._items && el._items.length) ? el._items.length : el.querySelectorAll(".picker-item").length;
      let i = Math.round(el.scrollTop / itemH);
      i = Math.max(0, Math.min(Math.max(0, n - 1), i));
      el._selectedIdx = i;
      el.scrollTop = i * itemH;
      el.querySelectorAll(".picker-item").forEach((node, k) => node.classList.toggle("active", k === i));
      return i;
    }
    let py = pickY, pm = pickM, pd = pickD, pLeap = !!pickLeap;
    if (yEl) py = minY + snapCol(yEl);
    if (mEl) {
      const mi = snapCol(mEl);
      if (pickerMode === "lunar" && mEl._monthMeta && mEl._monthMeta[mi]) {
        pm = mEl._monthMeta[mi].m; pLeap = !!mEl._monthMeta[mi].isLeap;
      } else { pm = mi + 1; pLeap = false; }
    }
    if (dEl) pd = snapCol(dEl) + 1;
    let sy, sm, sd;
    if (pickerMode === "lunar" && typeof lunarToSolar === "function") {
      const so = lunarToSolar(py, pm, pd, pLeap);
      sy = Number(so.year); sm = Number(so.month); sd = Number(so.day);
    } else {
      sy = Number(py); sm = Number(pm); sd = Number(pd);
    }
    const dim = new Date(sy, sm, 0).getDate();
    if (sd > dim) sd = dim;
    if (sd < 1) sd = 1;
    const want = sy + "-" + String(sm).padStart(2,"0") + "-" + String(sd).padStart(2,"0");
    window._pickerFocusDate = want;
    window._detailDate = want;
    pickY = py; pickM = pm; pickD = pd; pickLeap = pLeap;
    if (typeof closePicker === "function") closePicker();
    else {
      const mask = document.getElementById("pickerMask");
      if (mask) mask.hidden = true;
      document.body.style.overflow = "";
    }
    if (typeof syncYmLabel === "function") syncYmLabel(sy, sm);
    const ys = document.getElementById("yearSelect");
    const ms = document.getElementById("monthSelect");
    if (ys) ys.value = String(sy);
    if (ms) ms.value = String(sm);
    function selectWantedDay() {
      if (!current || !Array.isArray(current.days)) return false;
      if (Number(current.year) !== sy || Number(current.month) !== sm) return false;
      const day = current.days.find(d => d.date === want);
      if (day) { showDay(day); window._pickerFocusDate = null; return true; }
      return false;
    }
    if (current && Number(current.year) === sy && Number(current.month) === sm) {
      selectWantedDay();
    } else {
      Promise.resolve(tryLoadMonth(sy, sm)).finally(() => {
        setTimeout(selectWantedDay, 0);
        setTimeout(selectWantedDay, 120);
        setTimeout(selectWantedDay, 320);
      });
    }
  });

  // 初始标签
  syncYmLabel(current.year, current.month);

  // 非本月或非今日时显示「今日」
  function updateTodayChip() {
    const chip = document.getElementById("todayChip");
    if (!chip) return;
    const t = String(window.TODAY || "");
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
    if (!m || !current) { chip.hidden = true; return; }
    const ty = Number(m[1]), tm = Number(m[2]);
    const sameMonth = Number(current.year) === ty && Number(current.month) === tm;
    // 当前展示月不是今日所在月，或选中日不是今日 → 显示
    let selectedIsToday = false;
    const active = document.querySelector(".day-cell.active");
    // 用 current 与 TODAY 比较
    const focusDay = (current.days || []).find(d => {
      const el = document.querySelector(".day-cell.active");
      return false;
    });
    // 简化：只要当前月不是今日的月，或页面选中的 date 不是 TODAY
    let selDate = null;
    try {
      const idx = [...document.querySelectorAll(".day-cell")].findIndex(el => el.classList.contains("active"));
      if (idx >= 0 && current.days[idx]) selDate = current.days[idx].date;
    } catch (e) {}
    const need = !(sameMonth && selDate === t) && !(sameMonth && !selDate);
    // 更清晰：不在今日 → 显示
    const onToday = sameMonth && (selDate === t || (!selDate && sameMonth));
    // 若在本月且未点其它日，仍可能看今日；以选中日为准
    chip.hidden = (selDate ? selDate === t : sameMonth);
    // 若同月但选中不是今日，显示；若不同月，显示
    if (!sameMonth) chip.hidden = false;
    else if (selDate && selDate !== t) chip.hidden = false;
    else if (selDate === t) chip.hidden = true;
    else chip.hidden = true; // 同月默认视为今日焦点时由 showDay 再更新
  }

  const _showDayOrig = showDay;
  showDay = function(day) {
    _showDayOrig(day);
    const chip = document.getElementById("todayChip");
    if (!chip) return;
    const t = String(window.TODAY || "");
    chip.hidden = !day || day.date === t;
  };

  document.getElementById("todayChip")?.addEventListener("click", () => {
    const t = String(window.TODAY || "");
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
    if (!m) return;
    const ty = Number(m[1]), tm = Number(m[2]);
    const go = () => {
      if (current && current.days) {
        const day = current.days.find(d => d.date === t);
        if (day) showDay(day);
      }
      const chip = document.getElementById("todayChip");
      if (chip) chip.hidden = true;
    };
    if (Number(current.year) === ty && Number(current.month) === tm) {
      go();
    } else {
      tryLoadMonth(ty, tm);
      setTimeout(go, 280);
    }
  });


  
</script>
